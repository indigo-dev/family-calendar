name: Android (HomeWally)

# Builds the Android app from the same web code as the website.
# - every push to main: signed AAB as a download (Actions > run > Artifacts) and, once the Play service
#   account is stored, automatically uploaded to Google Play (internal testing) – the tablets update themselves
# - "Run workflow": the same by hand; untick "Play" for a build without upload
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   HOMEWALLY_KEYSTORE_BASE64    upload key (upload.p12) as base64 text
#   HOMEWALLY_KEYSTORE_PASSWORD  its password
#   PLAY_SERVICE_ACCOUNT_JSON    service account of the Play Console (only for the upload)
# Optional repository variable PLAY_RELEASE_STATUS: "draft" as long as the app was never published, then "completed".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      play:
        description: 'Zu Google Play hochladen (interner Test)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOMEWALLY_VERSION_CODE: ${{ github.run_number }}
      # only to check in "if:" whether the secrets exist (secrets cannot be used there directly)
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.HOMEWALLY_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Versionsname
        run: echo "HOMEWALLY_VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Upload-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMEWALLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOMEWALLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Upload-Schlüssel hinterlegt – das AAB bleibt unsigniert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "HOMEWALLY_KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo "HOMEWALLY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: AAB bauen
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: homewally-${{ env.HOMEWALLY_VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Zu Google Play hochladen (interner Test)
        if: >-
          env.HAS_PLAY_ACCOUNT == 'true' && env.HAS_UPLOAD_KEY == 'true' &&
          (github.event_name == 'push' || inputs.play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.indigodev.homewally
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
