# Cloudflare Worker "Weiterleitung" – Deploy: npm run worker:deploy
# Der Name muss zum Worker im Cloudflare-Dashboard passen (Adresse https://<name>.<konto>.workers.dev).
name = "familienkalender-ics"
main = "worker.js"
compatibility_date = "2026-11-01"

# Keine Logs: die Anfragen enthalten geheime Kalender-Links.
[observability]
enabled = false

[vars]
# Erlaubte Kalender-Server, durch Komma getrennt; "*" = jeder https-Server.
# Strenger, z. B.: "calendar.google.com, outlook.live.com, outlook.office365.com, *.icloud.com"
ALLOWED_HOSTS = "*"
# Seiten, die den Worker im Browser nutzen dürfen (localhost und Heimnetz sind immer erlaubt).
ALLOWED_ORIGINS = "https://indigo-dev.github.io"

# Den Zugangsschlüssel NICHT hier eintragen, sondern als Secret:
#   npx wrangler@4 secret put ACCESS_KEY --config worker/wrangler.toml
