# HomeWally ICS proxy (Cloudflare Worker) – deploy: npm run worker:deploy
# The name must match the worker in the Cloudflare dashboard (address https://<name>.<account>.workers.dev).
name = "homewally-ics-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# No logs: the requests contain secret calendar links.
[observability]
enabled = false

[vars]
# Allowed calendar servers, comma-separated; "*" = any https server.
# Stricter, e.g.: "calendar.google.com, outlook.live.com, outlook.office365.com, *.icloud.com"
ALLOWED_HOSTS = "*"
# Sites allowed to use the worker from the browser (localhost and the local network are always allowed).
ALLOWED_ORIGINS = "https://indigo-dev.github.io"

# Do NOT put the access key here, set it as a secret:
#   npx wrangler@4 secret put ACCESS_KEY --config worker/wrangler.toml
