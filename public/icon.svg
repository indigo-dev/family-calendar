<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HomeWally app icon (from icon-playstore.svg) on a rounded tile, for browser tab and home screen -->
  <defs>
    <clipPath id="hw-tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="hw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="hw-aura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hw-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="hw-roof" gradientUnits="userSpaceOnUse" x1="108" y1="200" x2="404" y2="140">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="55%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="hw-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07051A" flood-opacity="0.48"/>
    </filter>
  </defs>
  <g clip-path="url(#hw-tile)">
    <rect width="512" height="512" fill="url(#hw-bg)"/>
    <circle cx="256" cy="260" r="215" fill="url(#hw-aura)"/>
    <path filter="url(#hw-shadow)" fill="url(#hw-wall)" d="M142 222Q142 214 150 209L246 147Q256 141 266 147L362 209Q370 214 370 222L370 342Q370 378 334 378L206 378C182 378 158 396 138 402C129 404 125 398 128 388C132 372 142 358 142 338Z"/>
    <rect x="169" y="224" width="22" height="76" rx="11" fill="#F43F5E"/>
    <rect x="207" y="252" width="22" height="76" rx="11" fill="#F59E0B"/>
    <rect x="245" y="234" width="22" height="68" rx="11" fill="#10B981"/>
    <rect x="283" y="252" width="22" height="76" rx="11" fill="#0EA5E9"/>
    <rect x="321" y="224" width="22" height="76" rx="11" fill="#8B5CF6"/>
    <path fill="url(#hw-roof)" d="M154 181L154 130Q154 121 163 121L171 121Q180 121 180 130L180 164Z"/>
    <path d="M108 212L256 114L404 212" fill="none" stroke="url(#hw-roof)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
